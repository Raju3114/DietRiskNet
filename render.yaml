# Render blueprint for the DietRiskNet backend.
#
# NOTE: Render's FREE plan has an EMERGENT/temporary filesystem and does NOT
# include a persistent disk.  Meal-image uploads written under UPLOAD_DIR are
# therefore LOST on every redeploy unless a paid persistent disk (or object
# storage) is added.  The core pipeline, Postgres data, and models are safe:
# the database is managed Postgres (below) and the trained models are baked
# into the Docker image.

services:
  - type: web
    name: dietrisknet-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 8000
      # SECRET_KEY is auto-generated by Render. NEVER commit a real key.
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dietrisknet-db
          property: connectionString
      # Upload directory inside the container. On the free plan this is
      # ephemeral (see header note). Mount a paid persistent disk if durable
      # uploads are required.
      - key: UPLOAD_DIR
        value: /app/backend/uploads
      # Local Ollama provider by default. Render does NOT bundle Ollama; the
      # core pipeline runs without it and chat/degraded-AI returns friendly
      # fallbacks when no provider is reachable.
      - key: LLM_PROVIDER
        value: ollama
      # CORS origin for the deployed frontend. Leave empty when the frontend
      # is on vercel.app (a safe vercel.app pattern is allowed); set to the
      # real origin otherwise, e.g. https://your-app.vercel.app
      - key: FRONTEND_ORIGIN
        value: ""

databases:
  - name: dietrisknet-db
    plan: free